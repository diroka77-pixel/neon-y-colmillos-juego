name: Compilar Android y Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  GODOT_BASE_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.1

jobs:
  exportar:
    name: Exportar juegos
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7.0.1

      - name: Preparar Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: >-
            cmdline-tools;latest
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Comprobar y descargar Godot y sus plantillas
        shell: bash
        run: |
          set -euo pipefail
          ENGINE_URL="${GODOT_BASE_URL}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          TEMPLATES_URL="${GODOT_BASE_URL}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          curl --fail --silent --show-error --location --head "$ENGINE_URL" >/dev/null
          curl --fail --silent --show-error --location --head "$TEMPLATES_URL" >/dev/null
          curl --fail --silent --show-error --location "$ENGINE_URL" --output godot.zip
          curl --fail --silent --show-error --location "$TEMPLATES_URL" --output templates.tpz
          unzip -q godot.zip -d .godot-bin
          GODOT_FILE="$(find .godot-bin -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_FILE"
          install -m 0755 "$GODOT_FILE" .godot-bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d .godot-templates
          TEMPLATE_DIR="$(find .godot-templates -type d -name 'templates' -print -quit)"
          test -n "$TEMPLATE_DIR"
          cp -a "$TEMPLATE_DIR"/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/windows_debug_x86_64.exe"
          .godot-bin/godot --version | grep -F "${GODOT_VERSION}.stable"

      - name: Crear keystore de depuración temporal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Neon y Colmillos,C=ES"
          test -s "$HOME/.android/debug.keystore"

      - name: Validar el proyecto
        shell: bash
        run: |
          set -euo pipefail
          .godot-bin/godot --headless --editor --path . --quit
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.7.tres"
          test -f "$SETTINGS_FILE"
          sed -i "s|export/android/java_sdk_path = \".*\"|export/android/java_sdk_path = \"${JAVA_HOME}\"|" "$SETTINGS_FILE"
          sed -i "s|export/android/android_sdk_path = \".*\"|export/android/android_sdk_path = \"${ANDROID_HOME}\"|" "$SETTINGS_FILE"
          grep -F "export/android/java_sdk_path = \"${JAVA_HOME}\"" "$SETTINGS_FILE"
          grep -F "export/android/android_sdk_path = \"${ANDROID_HOME}\"" "$SETTINGS_FILE"
          .godot-bin/godot --headless --path . --quit-after 3

      - name: Exportar APK de depuración
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cp "$HOME/.android/debug.keystore" .debug.keystore
          mkdir -p build/android
          .godot-bin/godot --headless --path . --export-debug "Android" build/android/neon-y-colmillos.apk
          test -s build/android/neon-y-colmillos.apk
          rm -f .debug.keystore

      - name: Exportar Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          .godot-bin/godot --headless --path . --export-debug "Windows Desktop" build/windows/NeonYColmillos.exe
          test -s build/windows/NeonYColmillos.exe

      - name: Subir APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: neon-y-colmillos-android
          path: build/android/neon-y-colmillos.apk
          if-no-files-found: error
          retention-days: 30

      - name: Subir versión de Windows
        uses: actions/upload-artifact@v7.0.2
        with:
          name: neon-y-colmillos-windows
          path: build/windows/NeonYColmillos.exe
          if-no-files-found: error
          retention-days: 30

